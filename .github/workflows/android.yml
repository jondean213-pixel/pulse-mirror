name: Android build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK licenses + platform 36.1
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36.1" "build-tools;36.1.0" || "$SDKM" "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        env:
          PRESAGE_API_KEY: ${{ secrets.PRESAGE_API_KEY }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-mirror-debug
          path: app/build/outputs/apk/debug/*.apk
