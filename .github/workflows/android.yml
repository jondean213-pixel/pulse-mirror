name: Android build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install SDK 36.1
        run: sdkmanager "platforms;android-36.1" "build-tools;36.1.0" || sdkmanager "platforms;android-36" "build-tools;36.1.0"
      - name: Build debug APK
        env:
          PRESAGE_API_KEY: ${{ secrets.PRESAGE_API_KEY }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-mirror-debug
          path: app/build/outputs/apk/debug/*.apk
